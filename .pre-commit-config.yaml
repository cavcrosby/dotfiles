---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks.git
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: \.git-credentials\.shtpl

      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/cavcrosby/shellcheck-precommit.git
    rev: v0.13.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/betterleaks/betterleaks.git
    rev: v1.8.1
    hooks:
      - id: betterleaks

  - repo: https://github.com/tombi-toml/tombi-pre-commit.git
    rev: v1.5.4
    hooks:
      - id: tombi-lint
      - id: tombi-format
